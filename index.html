<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Marketing portfolio — digital marketing, content, analytics, and strategy." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Marketing Portfolio" />
    <meta property="og:description" content="Digital Marketing • Content • Analytics" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/marketing-portfolio/favicon.svg" />
    <title>Marketing Portfolio</title>
    <script>
      /* Restore clean URLs after the 404.html SPA redirect (GitHub Pages). */
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
